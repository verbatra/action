name: verbatra
description: Run verbatra i18n translations in CI or gate a pull request on locale drift, annotate failures, and write a job summary
author: Mario Kreitz

branding:
  icon: globe
  color: blue

inputs:
  version:
    description: >-
      The @verbatra/cli version to run, e.g. 1.2.3. PIN this to an exact version for reproducible,
      supply-chain-safe CI; do NOT use a floating tag such as "latest" (it pulls whatever is newest at
      run time, which is non-reproducible and would auto-pull a compromised release). The action
      rejects anything that is not an exact semver (dist-tags, ranges, and ^/~ prefixes all fail the
      step). Must be 0.9.3 or newer: older releases resolve a verbatra.config.ts import of
      defineConfig from @verbatra/cli or @verbatra/sdk against the config file's own location rather
      than against the running CLI, and the action no longer works around that. Required.
    required: true
  command:
    description: >-
      Which verbatra command to run. One of "translate" (default, writes translations),
      "check" (read-only, exits 1 when any locale has missing or stale keys), or "diff"
      (read-only, exits 1 when any locale has pending changes). The read-only commands need
      no provider API key, so they work as a CI gate on a fork pull request. Anything outside
      that set fails the step.
    required: false
    default: translate
  config-path:
    description: >-
      Explicit config file to load (maps to --config). A relative path resolves against
      working-directory, not against the repository root. Empty (the default) requires a
      recognized verbatra config file directly inside working-directory; the step fails
      before installing the CLI when none is found there. The lookup is strict and not
      inherited: it never walks up into a parent directory or the repository root, even
      when one of them holds a valid config.
    required: false
    default: ""
  working-directory:
    description: >-
      Directory to resolve config and locale files against (maps to --cwd). Config lookup
      (when config-path is empty) is strict: it looks only directly inside this directory,
      never a parent or ancestor, even when working-directory is unset and resolves to the
      repository root. For example, in a monorepo where the app to translate lives at
      apps/docs, set working-directory to apps/docs and put the config there; a config at
      the repository root does not satisfy the check.
    required: false
    default: ""
  dry-run:
    description: >-
      Report what would change without calling a provider or writing (maps to --dry-run). Applies
      only to the translate command; combining it with check or diff fails the step, because those
      commands are already read-only and the CLI rejects the flag.
    required: false
    default: "false"
  node-version:
    description: Node.js version to set up for running the CLI.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run verbatra
      id: run
      shell: bash
      env:
        VERBATRA_VERSION: ${{ inputs.version }}
        COMMAND: ${{ inputs.command }}
        CONFIG_PATH: ${{ inputs.config-path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DRY_RUN: ${{ inputs.dry-run }}
        SUMMARY_FILE: ${{ runner.temp }}/verbatra-summary.json
        ERROR_FILE: ${{ runner.temp }}/verbatra-error.txt
      run: |
        if ! [[ "$VERBATRA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "::error::the version input must be an exact semver version, e.g. 1.2.3 or 1.2.3-next.0. Dist-tags such as 'latest', ranges, and prefixes such as '^' or '~' are not allowed."
          exit 1
        fi
        minimum_version=0.9.3
        version_core="${VERBATRA_VERSION%%-*}"
        version_prerelease="${VERBATRA_VERSION#"$version_core"}"
        IFS=. read -r major minor patch <<<"$version_core"
        IFS=. read -r min_major min_minor min_patch <<<"$minimum_version"
        below_minimum=0
        if [ "$((10#$major))" -lt "$((10#$min_major))" ]; then
          below_minimum=1
        elif [ "$((10#$major))" -eq "$((10#$min_major))" ]; then
          if [ "$((10#$minor))" -lt "$((10#$min_minor))" ]; then
            below_minimum=1
          elif [ "$((10#$minor))" -eq "$((10#$min_minor))" ]; then
            if [ "$((10#$patch))" -lt "$((10#$min_patch))" ]; then
              below_minimum=1
            elif [ "$((10#$patch))" -eq "$((10#$min_patch))" ] && [ -n "$version_prerelease" ]; then
              below_minimum=1
            fi
          fi
        fi
        if [ "$below_minimum" -ne 0 ]; then
          echo "::error::the version input must be $minimum_version or newer. Earlier releases resolve a verbatra.config.ts import of defineConfig from '@verbatra/cli' or '@verbatra/sdk' against the config file's own location instead of against the running CLI, so a .ts config either fails to load or silently binds to a different, unpinned copy of those packages. Pin version to $minimum_version or newer."
          exit 1
        fi
        case "$COMMAND" in
          translate|check|diff) ;;
          *)
            echo "::error::the command input must be one of: translate, check, diff."
            exit 1
            ;;
        esac
        if [ "$DRY_RUN" = "true" ] && [ "$COMMAND" != "translate" ]; then
          echo "::error::the dry-run input applies only to the translate command. The check and diff commands are already read-only and the CLI rejects --dry-run. Remove dry-run, or set command to translate."
          exit 1
        fi
        echo "summary_file=$SUMMARY_FILE" >>"$GITHUB_OUTPUT"
        echo "error_file=$ERROR_FILE" >>"$GITHUB_OUTPUT"
        echo "command=$COMMAND" >>"$GITHUB_OUTPUT"
        set +e
        install_dir="$(cd "${WORKING_DIRECTORY:-.}" 2>/dev/null && pwd)"
        if [ -z "$install_dir" ]; then
          echo "the working-directory input '$WORKING_DIRECTORY' does not exist" >"$ERROR_FILE"
          : >"$SUMMARY_FILE"
          echo "exit_code=1" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        fail_before_install() {
          printf '%s\n' "$1" >"$ERROR_FILE"
          : >"$SUMMARY_FILE"
          echo "exit_code=1" >>"$GITHUB_OUTPUT"
          exit 0
        }
        if [ -n "$CONFIG_PATH" ]; then
          if [[ "$CONFIG_PATH" = /* ]]; then
            resolved_config="$CONFIG_PATH"
          else
            resolved_config="$install_dir/$CONFIG_PATH"
          fi
          if [ ! -f "$resolved_config" ]; then
            fail_before_install "the config-path input '$CONFIG_PATH' resolved to '$resolved_config', which does not exist. config-path and working-directory both control this resolution: a relative config-path resolves against working-directory."
          fi
        else
          resolved_config="$(node "$GITHUB_ACTION_PATH/resolve-config.mjs" "$install_dir" 2>"$ERROR_FILE")"
          if [ $? -ne 0 ]; then
            fail_before_install "no recognized verbatra config file was found directly inside '$install_dir', which is resolved from the working-directory input. Add a config file there, or set config-path explicitly."
          fi
        fi
        scratch_dir="$(mktemp -d)"
        npm install --no-save --silent --prefix "$scratch_dir" \
          "@verbatra/cli@$VERBATRA_VERSION" "@verbatra/sdk@$VERBATRA_VERSION" >"$ERROR_FILE" 2>&1
        if [ $? -ne 0 ]; then
          : >"$SUMMARY_FILE"
          echo "exit_code=1" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        args=("$COMMAND" --json --cwd "$install_dir" --config "$resolved_config")
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        npm exec --prefix "$scratch_dir" -- verbatra "${args[@]}" >"$SUMMARY_FILE" 2>"$ERROR_FILE"
        echo "exit_code=$?" >>"$GITHUB_OUTPUT"
        exit 0

    - name: Annotate and summarize
      shell: bash
      env:
        SUMMARY_FILE: ${{ steps.run.outputs.summary_file }}
        ERROR_FILE: ${{ steps.run.outputs.error_file }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        COMMAND: ${{ steps.run.outputs.command }}
      run: node "$GITHUB_ACTION_PATH/annotate.mjs" "$SUMMARY_FILE" "$ERROR_FILE" "$EXIT_CODE" "$COMMAND"
