name: verbatra
description: Run verbatra translations or a read-only drift gate in CI, with annotations and a job summary
author: Mario Kreitz

branding:
  icon: globe
  color: blue

inputs:
  version:
    description: >-
      Exact @verbatra/cli version to install, for example 0.12.0. Must be 0.9.3 or newer; tags, ranges and prefixes are rejected.
    required: true
  command:
    description: >-
      The verbatra command to run: "translate" (default), "check" or "diff". The last two are read-only and need no API key.
    required: false
    default: translate
  config-path:
    description: >-
      Config file to load (--config). A relative path resolves against working-directory. When empty, a config must exist directly inside working-directory; parent directories are never searched.
    required: false
    default: ""
  working-directory:
    description: >-
      Directory holding the verbatra config and locale files (--cwd). Defaults to the repository root; in a monorepo, set it to the app directory.
    required: false
    default: ""
  dry-run:
    description: >-
      Preview a translate run without calling a provider or writing files (--dry-run). Only valid with command translate. "true" or "false".
    required: false
    default: "false"
  qa:
    description: >-
      Run the quality check over every committed translation and annotate each finding (--qa). Only valid with command check; needs CLI 0.12.0 or newer. "true" or "false".
    required: false
    default: "false"
  qa-severity:
    description: >-
      Lowest quality-check severity to report, "error" or "warning" (--severity). Empty reports both. Requires qa; "error" cannot be combined with qa-strict.
    required: false
    default: ""
  qa-strict:
    description: >-
      Also fail when the quality check reports only warnings (--strict). Requires qa. "true" or "false".
    required: false
    default: "false"
  require-reviewed:
    description: >-
      Fail while any machine-written translation is not approved in verbatra.provenance.json (--require-reviewed). Only valid with command check; needs CLI 0.12.0 or newer. "true" or "false".
    required: false
    default: "false"
  sensitive:
    description: >-
      Scan the source file and glossary for sensitive content such as emails, keys or card numbers, and fail on any finding (--sensitive). Only valid with command check; needs CLI 0.12.0 or newer. "true" or "false".
    required: false
    default: "false"
  locales:
    description: >-
      Comma-separated subset of target locales, for example "de,fr" (--locales). Empty runs every target locale. Only letters, digits, "-", "_" and commas are accepted.
    required: false
    default: ""
  node-version:
    description: >-
      Node.js version to set up. For CLI 0.13.0 or newer it must be 22.22.0 or newer on the 22 line, or an even-numbered line from 24 up. Older CLI rules are in the README.
    required: false
    default: "24"

outputs:
  needs-human:
    description: >-
      "true" when translate exited 3 because machine translation is disabled by policy
      (provider none) and keys are left for a human translation, otherwise "false". The step
      passes in that case, so branch on this output to hand the keys off.
    value: ${{ steps.annotate.outputs.needs-human }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run verbatra
      id: run
      shell: bash
      env:
        VERBATRA_VERSION: ${{ inputs.version }}
        COMMAND: ${{ inputs.command }}
        CONFIG_PATH: ${{ inputs.config-path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DRY_RUN: ${{ inputs.dry-run }}
        QA: ${{ inputs.qa }}
        QA_SEVERITY: ${{ inputs.qa-severity }}
        QA_STRICT: ${{ inputs.qa-strict }}
        REQUIRE_REVIEWED: ${{ inputs.require-reviewed }}
        SENSITIVE: ${{ inputs.sensitive }}
        LOCALES: ${{ inputs.locales }}
        SUMMARY_FILE: ${{ runner.temp }}/verbatra-summary.json
        ERROR_FILE: ${{ runner.temp }}/verbatra-error.txt
        LOCALE_FILES_FILE: ${{ runner.temp }}/verbatra-locale-files.json
      run: bash "$GITHUB_ACTION_PATH/src/run.sh"

    - name: Annotate and summarize
      id: annotate
      shell: bash
      env:
        SUMMARY_FILE: ${{ steps.run.outputs.summary_file }}
        ERROR_FILE: ${{ steps.run.outputs.error_file }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        COMMAND: ${{ steps.run.outputs.command }}
        LOCALE_FILES_FILE: ${{ steps.run.outputs.locale_files_file }}
        QA_STRICT: ${{ inputs.qa-strict }}
      run: node "$GITHUB_ACTION_PATH/src/annotate.mjs" "$SUMMARY_FILE" "$ERROR_FILE" "$EXIT_CODE" "$COMMAND" "$LOCALE_FILES_FILE"
