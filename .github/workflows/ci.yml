name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the test suite with coverage
        run: npm test

  self-test:
    name: Self-test the composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the dry-run fixture
        uses: ./
        with:
          version: 0.9.0
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Run check against the in-sync fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/in-sync

      - name: Run diff against the in-sync fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: diff
          working-directory: .github/fixtures/in-sync

      - name: Run check against the ts-config fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/ts-config

      - name: Run check against the ts-config-sdk-import fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/ts-config-sdk-import

      - name: Run check against the pnpm-workspace-protocols fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/pnpm-workspace-protocols

      - name: Run check against the preserves-consumer-deps fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/preserves-consumer-deps

      - name: Assert the action never touched the consumer's own node_modules entries
        run: |
          if ! git diff --exit-code HEAD -- .github/fixtures/preserves-consumer-deps/node_modules/zod .github/fixtures/preserves-consumer-deps/node_modules/debug; then
            echo "::error::the action modified a tracked file under the consumer's own node_modules/zod or node_modules/debug; this regresses the node_modules merge bug"
            exit 1
          fi

      - name: Run check against the drifted fixture
        id: check-drifted
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/dry-run

      - name: Assert a drifted check failed the step
        if: steps.check-drifted.outcome != 'failure'
        run: |
          echo "::error::check exited 0 against a drifted fixture; the read-only gate does not fail the job on drift"
          exit 1

      - name: Run diff against the fixture with pending changes
        id: diff-pending
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.0
          command: diff
          working-directory: .github/fixtures/dry-run

      - name: Assert a pending diff failed the step
        if: steps.diff-pending.outcome != 'failure'
        run: |
          echo "::error::diff exited 0 against a fixture with pending changes; the read-only gate does not fail the job on pending changes"
          exit 1

      - name: Reject an unsupported command input
        id: bad-command
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.0
          command: publish
          working-directory: .github/fixtures/in-sync

      - name: Assert the unsupported command input was rejected
        if: steps.bad-command.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the unsupported command input 'publish'; the allowed-command guard is not working"
          exit 1

      - name: Reject dry-run combined with a read-only command
        id: dry-run-with-check
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.0
          command: check
          working-directory: .github/fixtures/in-sync
          dry-run: "true"

      - name: Assert dry-run combined with check was rejected rather than silently ignored
        if: steps.dry-run-with-check.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted dry-run together with command: check; the input was silently ignored instead of failing loudly"
          exit 1

      - name: Reject a floating version input
        id: floating
        continue-on-error: true
        uses: ./
        with:
          version: latest
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the floating version input was rejected
        if: steps.floating.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the floating version input 'latest'; the exact-semver guard is not working"
          exit 1

      - name: Assert the forged version input reaches a step as a real multi-line value
        env:
          FORGED_VERSION: "9.9.9-forged\n::stop-commands::forged"
        run: |
          if [ "$(printf '%s' "$FORGED_VERSION" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::the forged version input is not multi-line, so the rejection case below does not exercise the command-forging vector"
            exit 1
          fi

      - name: Reject a version input whose second line forges a workflow command
        id: forged
        continue-on-error: true
        uses: ./
        with:
          version: "9.9.9-forged\n::stop-commands::forged"
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the version input carrying a forged workflow command was rejected
        if: steps.forged.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted a version input carrying a forged workflow command; the exact-semver guard is not working"
          exit 1

      - name: Assert the version-guard annotation omits the rejected value so a newline inside it cannot forge a second workflow command
        run: bash ./assert-version-guard-annotation.sh

      - name: Assert the command-guard annotation omits the rejected value so a newline inside it cannot forge a second workflow command
        run: bash ./assert-command-guard-annotation.sh
