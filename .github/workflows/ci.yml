name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the test suite with coverage
        run: npm test
      - name: Check the README input reference matches action.yml
        run: npm run docs:usage:check

  self-test:
    name: Self-test the composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the dry-run fixture
        uses: ./
        with:
          version: 0.9.3
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Run check against the in-sync fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/in-sync

      - name: Run diff against the in-sync fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: diff
          working-directory: .github/fixtures/in-sync

      - name: Run check against the ts-config fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/ts-config

      - name: Run check against the ts-config-sdk-import fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/ts-config-sdk-import

      - name: Run check against the pnpm-workspace-protocols fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/pnpm-workspace-protocols

      - name: Run check against the preserves-consumer-deps fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/preserves-consumer-deps

      - name: Assert the action never wrote anything into the consumer's own node_modules
        run: |
          if ! git diff --exit-code HEAD -- .github/fixtures/preserves-consumer-deps/node_modules/zod .github/fixtures/preserves-consumer-deps/node_modules/debug; then
            echo "::error::the action modified a tracked file under the consumer's own node_modules/zod or node_modules/debug; this regresses the node_modules merge bug"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- .github/fixtures/preserves-consumer-deps/node_modules)" ]; then
            echo "::error::the action added or removed an entry under the consumer's own node_modules; the run step must never write into the consumer's tree at all, symlinks included"
            git status --porcelain -- .github/fixtures/preserves-consumer-deps/node_modules
            exit 1
          fi

      - name: Run check against the config-guard-present fixture, which must pass the gate
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/config-guard-present

      - name: Run check against the config-guard-not-inherited fixture's subdirectory, which has no config of its own
        id: config-guard-nested
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/config-guard-not-inherited/child

      - name: Assert the not-inherited config fixture failed the step
        if: steps.config-guard-nested.outcome != 'failure'
        run: |
          echo "::error::working-directory pointed at a subdirectory with no config of its own, but the step succeeded; the guard is inheriting the parent's config instead of enforcing 'strict, not inherited'"
          exit 1

      - name: Assert the not-inherited config failure names the resolved child directory, not the parent's
        run: |
          child_dir="$(cd .github/fixtures/config-guard-not-inherited/child && pwd)"
          error_file="${{ runner.temp }}/verbatra-error.txt"
          if ! grep -qF "$child_dir" "$error_file"; then
            echo "::error::the config guard's failure message did not name the resolved child directory '$child_dir'; check that install_dir is computed from the resolved working-directory, not inherited from the parent"
            cat "$error_file"
            exit 1
          fi

      - name: Run check against the drifted fixture
        id: check-drifted
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/dry-run

      - name: Assert a drifted check failed the step
        if: steps.check-drifted.outcome != 'failure'
        run: |
          echo "::error::check exited 0 against a drifted fixture; the read-only gate does not fail the job on drift"
          exit 1

      - name: Run diff against the fixture with pending changes
        id: diff-pending
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.3
          command: diff
          working-directory: .github/fixtures/dry-run

      - name: Assert a pending diff failed the step
        if: steps.diff-pending.outcome != 'failure'
        run: |
          echo "::error::diff exited 0 against a fixture with pending changes; the read-only gate does not fail the job on pending changes"
          exit 1

      - name: Reject an unsupported command input
        id: bad-command
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.3
          command: publish
          working-directory: .github/fixtures/in-sync

      - name: Assert the unsupported command input was rejected
        if: steps.bad-command.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the unsupported command input 'publish'; the allowed-command guard is not working"
          exit 1

      - name: Reject dry-run combined with a read-only command
        id: dry-run-with-check
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.3
          command: check
          working-directory: .github/fixtures/in-sync
          dry-run: "true"

      - name: Assert dry-run combined with check was rejected rather than silently ignored
        if: steps.dry-run-with-check.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted dry-run together with command: check; the input was silently ignored instead of failing loudly"
          exit 1

      - name: Reject a dry-run input that is not "true" or "false"
        id: dry-run-not-boolean
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          working-directory: .github/fixtures/in-sync
          dry-run: "yes"

      - name: Assert the non-boolean dry-run input was rejected rather than read as false
        if: steps.dry-run-not-boolean.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted dry-run: yes; the boolean input guard is not working"
          exit 1

      - name: Reject a qa input that is not "true" or "false"
        id: qa-not-boolean
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          command: check
          working-directory: .github/fixtures/in-sync
          qa: "TRUE"

      - name: Assert the non-boolean qa input was rejected rather than read as false
        if: steps.qa-not-boolean.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa: TRUE; the boolean input guard is not working"
          exit 1

      - name: Reject a qa-strict input that is not "true" or "false"
        id: qa-strict-not-boolean
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          command: check
          working-directory: .github/fixtures/in-sync
          qa-strict: "1"

      - name: Assert the non-boolean qa-strict input was rejected rather than read as false
        if: steps.qa-strict-not-boolean.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa-strict: 1; the boolean input guard is not working"
          exit 1

      - name: Reject qa combined with a command other than check
        id: qa-with-translate
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          working-directory: .github/fixtures/in-sync
          dry-run: "true"
          qa: "true"

      - name: Assert qa combined with translate was rejected
        if: steps.qa-with-translate.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa together with command: translate; the qa command guard is not working"
          exit 1

      - name: Reject qa-strict without qa
        id: qa-strict-alone
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          command: check
          working-directory: .github/fixtures/in-sync
          qa-strict: "true"

      - name: Assert qa-strict without qa was rejected rather than silently ignored
        if: steps.qa-strict-alone.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa-strict without qa; the input was silently ignored instead of failing loudly"
          exit 1

      - name: Reject qa with a version below the quality check's minimum
        id: qa-below-minimum
        continue-on-error: true
        uses: ./
        with:
          version: 0.11.1
          command: check
          working-directory: .github/fixtures/in-sync
          qa: "true"

      - name: Assert qa with a version below its minimum was rejected
        if: steps.qa-below-minimum.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa with version 0.11.1, which has no check --qa; the qa minimum-version guard is not working"
          exit 1

      - name: Reject qa with a prerelease of the quality check's minimum version
        id: qa-prerelease
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0-next.0
          command: check
          working-directory: .github/fixtures/in-sync
          qa: "true"

      - name: Assert qa with a 0.12.0 prerelease was rejected, as semver ranks it below 0.12.0
        if: steps.qa-prerelease.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted qa with version 0.12.0-next.0; a prerelease ranks below its release, so the qa minimum-version guard must reject it"
          exit 1

      - name: Reject a require-reviewed input that is not "true" or "false"
        id: require-reviewed-not-boolean
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          command: check
          working-directory: .github/fixtures/in-sync
          require-reviewed: "yes"

      - name: Assert the non-boolean require-reviewed input was rejected rather than read as false
        if: steps.require-reviewed-not-boolean.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted require-reviewed: yes; the boolean input guard is not working"
          exit 1

      - name: Reject require-reviewed combined with a command other than check
        id: require-reviewed-with-diff
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0
          command: diff
          working-directory: .github/fixtures/in-sync
          require-reviewed: "true"

      - name: Assert require-reviewed combined with diff was rejected
        if: steps.require-reviewed-with-diff.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted require-reviewed together with command: diff; the require-reviewed command guard is not working"
          exit 1

      - name: Reject require-reviewed with a version below the review gate's minimum
        id: require-reviewed-below-minimum
        continue-on-error: true
        uses: ./
        with:
          version: 0.11.1
          command: check
          working-directory: .github/fixtures/in-sync
          require-reviewed: "true"

      - name: Assert require-reviewed with a version below its minimum was rejected
        if: steps.require-reviewed-below-minimum.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted require-reviewed with version 0.11.1, which has no check --require-reviewed; the require-reviewed minimum-version guard is not working"
          exit 1

      - name: Reject require-reviewed with a prerelease of the review gate's minimum version
        id: require-reviewed-prerelease
        continue-on-error: true
        uses: ./
        with:
          version: 0.12.0-next.0
          command: check
          working-directory: .github/fixtures/in-sync
          require-reviewed: "true"

      - name: Assert require-reviewed with a 0.12.0 prerelease was rejected, as semver ranks it below 0.12.0
        if: steps.require-reviewed-prerelease.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted require-reviewed with version 0.12.0-next.0; a prerelease ranks below its release, so the require-reviewed minimum-version guard must reject it"
          exit 1

      - name: Reject a version input below the minimum the action supports
        id: below-minimum
        continue-on-error: true
        uses: ./
        with:
          version: 0.9.1
          command: check
          working-directory: .github/fixtures/ts-config

      - name: Assert the below-minimum version input was rejected
        if: steps.below-minimum.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted version 0.9.1, which predates the SDK fix that resolves a verbatra.config.ts import of defineConfig against the running CLI; the minimum-version guard is not working"
          exit 1

      - name: Reject a floating version input
        id: floating
        continue-on-error: true
        uses: ./
        with:
          version: latest
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the floating version input was rejected
        if: steps.floating.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the floating version input 'latest'; the exact-semver guard is not working"
          exit 1

      - name: Assert the forged version input reaches a step as a real multi-line value
        env:
          FORGED_VERSION: "9.9.9-forged\n::stop-commands::forged"
        run: |
          if [ "$(printf '%s' "$FORGED_VERSION" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::the forged version input is not multi-line, so the rejection case below does not exercise the command-forging vector"
            exit 1
          fi

      - name: Reject a version input whose second line forges a workflow command
        id: forged
        continue-on-error: true
        uses: ./
        with:
          version: "9.9.9-forged\n::stop-commands::forged"
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the version input carrying a forged workflow command was rejected
        if: steps.forged.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted a version input carrying a forged workflow command; the exact-semver guard is not working"
          exit 1

      - name: Assert the version-guard annotation omits the rejected value so a newline inside it cannot forge a second workflow command
        run: bash ./assert-version-guard-annotation.sh

      - name: Assert the command-guard annotation omits the rejected value so a newline inside it cannot forge a second workflow command
        run: bash ./assert-command-guard-annotation.sh

      - name: Assert the config guard passes the resolved config path to the CLI via --config
        run: bash ./assert-config-guard-passthrough.sh

      - name: Assert require-reviewed passes --require-reviewed to the CLI exactly when it is true
        run: bash ./assert-require-reviewed-passthrough.sh

      - name: Assert an absolute config-path is used as-is, not re-resolved against working-directory
        run: bash ./assert-config-guard-absolute-path.sh

      - name: Assert the config-path guard's failure is escaped so a newline inside it cannot forge a second workflow command
        run: bash ./assert-config-guard-hostile-input.sh

      - name: Assert a resolve-config.mjs failure's raw stderr never reaches the step log or survives fail_before_install's overwrite of ERROR_FILE
        run: bash ./assert-config-guard-stderr-overwritten.sh
