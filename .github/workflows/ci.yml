name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the whole workflow. Nothing here writes to the repository, comments on a
# pull request, or publishes anything, so read access to the contents is all any job needs. Both
# jobs restate it at the job level so a later workflow-level widening cannot silently reach them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 22.14.0 is the engines floor declared in package.json; 24 is the action.yml default that
        # a consumer gets when they do not set node-version. Both have to stay green.
        node-version: ["22.14.0", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the test suite with coverage
        run: npm test

  self-test:
    name: Self-test the composite action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exercises action.yml itself: the input wiring, the semver guard, the npx invocation, and
      # the annotate step's "$GITHUB_ACTION_PATH/annotate.mjs" resolution. `uses: ./` runs the
      # action from this checkout rather than from a published ref, so a broken composite fails
      # here instead of in a consumer's workflow.
      #
      # No provider API key is set, and none is needed: with dry-run true the CLI runs
      # `translate --dry-run`, and the SDK constructs a provider only when dryRun is false. The
      # job therefore also passes on a pull request from a fork, where no secret is available.
      - name: Run the action against the dry-run fixture
        uses: ./
        with:
          version: 0.7.1
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      # The negative half: a floating version must fail the step before anything is installed.
      # continue-on-error records the outcome instead of ending the job, so the next step can
      # assert on it.
      - name: Reject a floating version input
        id: floating
        continue-on-error: true
        uses: ./
        with:
          version: latest
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the floating version input was rejected
        if: steps.floating.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the floating version input 'latest'; the exact-semver guard is not working"
          exit 1
