name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the test suite with coverage
        run: npm test

  self-test:
    name: Self-test the composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the dry-run fixture
        uses: ./
        with:
          version: 0.7.1
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Reject a floating version input
        id: floating
        continue-on-error: true
        uses: ./
        with:
          version: latest
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the floating version input was rejected
        if: steps.floating.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the floating version input 'latest'; the exact-semver guard is not working"
          exit 1
