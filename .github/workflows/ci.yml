name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the test suite with coverage
        run: npm test

  self-test:
    name: Self-test the composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the dry-run fixture
        uses: ./
        with:
          version: 0.8.0
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Reject a floating version input
        id: floating
        continue-on-error: true
        uses: ./
        with:
          version: latest
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the floating version input was rejected
        if: steps.floating.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted the floating version input 'latest'; the exact-semver guard is not working"
          exit 1

      - name: Assert the forged version input reaches a step as a real multi-line value
        env:
          FORGED_VERSION: "9.9.9-forged\n::stop-commands::forged"
        run: |
          if [ "$(printf '%s' "$FORGED_VERSION" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::the forged version input is not multi-line, so the rejection case below does not exercise the command-forging vector"
            exit 1
          fi

      - name: Reject a version input whose second line forges a workflow command
        id: forged
        continue-on-error: true
        uses: ./
        with:
          version: "9.9.9-forged\n::stop-commands::forged"
          working-directory: .github/fixtures/dry-run
          dry-run: "true"

      - name: Assert the version input carrying a forged workflow command was rejected
        if: steps.forged.outcome != 'failure'
        run: |
          echo "::error::action.yml accepted a version input carrying a forged workflow command; the exact-semver guard is not working"
          exit 1

      - name: Assert the version-guard annotation omits the rejected value so a newline inside it cannot forge a second workflow command
        run: bash ./assert-version-guard-annotation.sh
