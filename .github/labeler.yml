"scope: action":
  - changed-files:
      - any-glob-to-any-file:
          - action.yml
          - src/**
          - scripts/**
          - tests/**

"scope: docs":
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CHANGELOG.md

"scope: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
